[project]
name = "spread-engine"
version = "0.1.0"
description = "The bot's local engine: a small HTTP service on your machine that runs the uselayer SDK with your own keys."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
  # 0.4.0: buy_best/preview_best, the gross spread and return per day on quote(). 0.4.1: Polymarket US fee history before 2026-09-25 (Replay).
  "uselayer>=0.4.3,<0.5",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spread_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
